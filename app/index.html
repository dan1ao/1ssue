<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vite-project</title>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
      }
      html {
        overscroll-behavior: none;
      }
    </style>
    <style>
      .root-spin-container {
        display: flex;
        position: absolute;
        row-gap: 32px;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .root-spin-dot {
        display: inline-block;
        position: relative;
        transform: rotate(45deg);
        animation: rootRotate 1.2s infinite linear;
        width: 32px;
        height: 32px;
        font-size: 32px;
      }

      .root-spin-dot i {
        width: 14px;
        height: 14px;
      }

      .root-spin-dot-item {
        display: block;
        position: absolute;
        transform: scale(0.75);
        transform-origin: 50% 50%;
        opacity: 0.3;
        animation: rootSpinMove 1s infinite linear alternate;
        border-radius: 100%;
        background-color: #3a0252;
        width: 9px;
        height: 9px;
      }

      .root-spin-dot-item:nth-child(1) {
        top: 0;
        left: 0;
      }

      .root-spin-dot-item:nth-child(2) {
        top: 0;
        right: 0;
        animation-delay: 0.4s;
      }

      .root-spin-dot-item:nth-child(3) {
        right: 0;
        bottom: 0;
        animation-delay: 0.8s;
      }

      .root-spin-dot-item:nth-child(4) {
        bottom: 0;
        left: 0;
        animation-delay: 1.2s;
      }

      @keyframes rootSpinMove {
        to {
          opacity: 1;
        }
      }

      @keyframes rootRotate {
        to {
          transform: rotate(405deg);
        }
      }
    </style>
    
  </head>
  <body>
    <div class="root-spin-container" id="root-loading">
      <div class="root-spin-spinning">
        <span class="root-spin-dot root-spin-dot-spin">
          <i class="root-spin-dot-item"></i>
          <i class="root-spin-dot-item"></i>
          <i class="root-spin-dot-item"></i>
          <i class="root-spin-dot-item"></i>
        </span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="src/main.tsx" id="main"></script>
    <script>
      const scriptElement = document.getElementById('main')
      if (scriptElement) {
        function onLoad() {
          const loadingElement = document.getElementById('root-loading')
          loadingElement.style.display = 'none';
        }
        scriptElement.addEventListener(
          'load',
          onLoad,
          { once: true },
        )
      }
    </script>
  </body>
</html>
