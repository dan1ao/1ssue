name: Publish Packages
permissions:
  contents: write

on:
  push:
    branches:
      - next
      - release
    paths:
      - 'packages/**/*'
      - 'app/**/*'
      - 'pnpm-lock.yaml'
      - 'package.json'

env:
  PNPM_CACHE_FOLDER: .pnpm-store
jobs:
  publish:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 0 indicates all history for all branches and tags，保留所有历史，为了让lerna publish 时可以生成有效的change log
          fetch-depth: 0
          fetch-tags: true # ← 显式声明拉取 tags
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Debug git tags
        run: |
          git tag --points-at HEAD    # 查看当前 HEAD 上有哪些 tag
          git log --oneline -5        # 查看最近几次提交

        # lerna publish 后会提交代码到master分支，这里是为了配置 git 用户，区分用户
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      # 先装 pnpm（用 runner 预装的 node）
      - name: Setup pnpm
        uses: pnpm/action-setup@v5.0.0

      # 再切换 node 版本 + 写入 .npmrc（最后写，不会被覆盖）
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build
        id: build
        run: pnpm run build

      - name: Test npm publish directly
        run: |
          cd packages/config/browserslist
          npm publish --access public --tag next --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}

      - name: Publish next
        if: github.ref_name == 'next'
        run: pnpm run next
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release
        if: github.ref_name == 'release'
        run: pnpm run release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Info
        id: info
        run: |
          publish=$(git rev-parse HEAD)
          current=${{github.sha}}
          tags=$(git tag --list --contains $publish)
          if [ "$current" != "$publish" ] && [ -n "$tags" ]; then
            echo "versions="$(echo "$tags" | sed 's/@1ssue/{0}@1ssue/g')"" >> $GITHUB_OUTPUT
          fi

      - name: Debug git tags
        run: |
          git tag --points-at HEAD    # 查看当前 HEAD 上有哪些 tag
          git log --oneline -5        # 查看最近几次提交

      # ✅ 成功通知
      - name: Notify Feishu on success
        if: steps.info.outputs.versions
        run: node scripts/notify-feishu.js
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          BUILD_STATUS: success
          BUILD_REPO: ${{ github.repository }}
          BUILD_REF: ${{ github.ref_name }}
          BUILD_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # ❌ 失败通知
      - name: Notify Feishu on failure
        if: failure()
        run: node scripts/notify-feishu.js
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          BUILD_STATUS: failure
          BUILD_REPO: ${{ github.repository }}
          BUILD_REF: ${{ github.ref_name }}
          BUILD_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
